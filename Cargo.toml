[package]
name = "rust-node2go"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21"
base64-url = "2"
rand = "0.8"
x25519-dalek = "2"
rcgen = "0.11"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "1"
ring = "0.17"
hex = "0.4"
x509-parser = "0.16"

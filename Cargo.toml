[package]
name = "rust-sub"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
# 关闭默认 native-tls，启用 rustls-tls
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21"
rand = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
